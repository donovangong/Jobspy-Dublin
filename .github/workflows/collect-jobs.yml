name: Collect jobs and update website

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect and generate website
        run: |
          python -u - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from job_logic import scrape_all_jobs, filter_jobs, build_html

          raw = scrape_all_jobs()
          jobs = filter_jobs(raw)
          if raw.empty or jobs.empty:
              raise RuntimeError("No usable jobs collected; keeping the existing website.")
          generated_at = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
          Path("docs").mkdir(exist_ok=True)
          Path("docs/index.html").write_text(build_html(jobs, generated_at), encoding="utf-8")
          jobs.to_csv("docs/jobs-dublin.csv", index=False)
          summary = f"Collected {len(raw)} rows; published {len(jobs)} jobs. Updated: {generated_at} UTC."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          PY

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/jobs-dublin.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update jobs page and CSV"
          git pull --rebase origin main
          git push origin HEAD:main

      # Commits made with GITHUB_TOKEN do not automatically trigger Pages.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
